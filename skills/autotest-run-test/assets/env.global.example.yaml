# Copy file này thành testing/env/global.yaml của project rồi điền giá trị
# THẬT — đây chỉ là mẫu, KHÔNG dùng thẳng giá trị ví dụ bên dưới.
#
# Biến ở đây dùng CHUNG cho MỌI feature (đọc bằng autotest_env.global_vars()).
# Cấu trúc: khoá cấp 1 là môi trường (uat/prod) — KHÔNG đổi tên 2 khoá này,
# autotest_env.py đọc đúng theo tên "uat"/"prod".

uat:
  base_url: "https://uat.example.com"      # URL app ở môi trường UAT
  api_url: "https://uat-api.example.com"   # URL API backend ở UAT (nếu test API riêng)

prod:
  base_url: "https://example.com"          # URL app ở môi trường PROD (thật)
  api_url: "https://api.example.com"       # URL API backend ở PROD (thật)
