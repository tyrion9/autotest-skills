# Mẫu file biến RIÊNG cho 1 feature. Copy thành
# testing/env/local/<ten-feature>.yaml — TÊN FILE PHẢI KHỚP tên truyền vào
# autotest_env.local_vars("<ten-feature>") trong step definitions, vd feature
# "tra_cuu_so_dien_thoai" -> testing/env/local/tra_cuu_so_dien_thoai.yaml.
#
# Dùng cho data chỉ feature này cần: path riêng, số điện thoại/tài khoản cần
# tra cứu, data test cụ thể... KHÔNG đưa biến dùng chung (vd base_url) vào
# đây — biến chung để ở testing/env/global.yaml.

uat:
  phone_number: "0901234567"     # số test có sẵn trong DB UAT — điền số thật khi setup
  search_keyword: "áo thun nam"  # từ khoá tra cứu dùng ở môi trường UAT

prod:
  phone_number: "0909999999"     # số test THẬT đã được duyệt dùng trên PROD
  search_keyword: "áo thun nam"  # có thể khác UAT nếu data PROD khác
