name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pict-cli@0.2 khai engines: ^22 || ^24 -> test đúng 2 dòng LTS được hỗ trợ
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài dependencies
        run: pip install pytest openpyxl

      - name: Unit test cho 2 script sinh testcase
        run: pytest tests -q

  lint-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kiểm tra frontmatter của mọi SKILL.md
        run: python scripts/validate_skills.py
